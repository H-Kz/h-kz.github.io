<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>道の駅ナビ - おすすめの道の駅</title>
    <meta name="description" content="現在地から最も近いおすすめの道の駅を表示します。">
    <link rel="stylesheet" href="../styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
        rel="stylesheet">
</head>

<body class="recommend-page">
    <header class="main-header">
        <h1>最寄りの道の駅</h1>
    </header>

    <div id="app">
        <!-- メインコンテンツ -->
        <main id="main-content" class="hidden">
            <section id="recommendation-container">
                <div id="recommendation-card" class="premium-card">
                    <div class="card-hero-image">
                        <img id="station-image" src="../icon/noimage250.png" alt="道の駅の画像">
                        <div class="image-gradient"></div>
                    </div>

                    <div class="card-content-wrapper">
                        <div class="card-header-top">
                            <div class="station-meta">
                                <h1 id="station-name" class="station-name">読み込み中...</h1>
                                <div class="location-badges">
                                    <span id="station-prefecture">---</span>
                                    <span id="station-city">---</span>
                                </div>
                            </div>
                            <div id="distance-container" class="distance-tag">
                                <span id="station-distance">--</span><small>km</small>
                            </div>
                        </div>

                        <div class="card-details">
                            <div class="amenity-grid">
                                <div id="icon-toilet" class="amenity-item inactive">
                                    <div class="icon-wrap"><img src="../icon/toilet.png" alt="トイレの有無は不明です"></div>
                                    <span class="amenity-label">トイレ</span>
                                </div>
                                <div id="icon-restaurant" class="amenity-item inactive">
                                    <div class="icon-wrap"><img src="../icon/restrant.png" alt="レストランの有無は不明です"></div>
                                    <span class="amenity-label">レストラン</span>
                                </div>
                                <div id="icon-shop" class="amenity-item inactive">
                                    <div class="icon-wrap"><img src="../icon/shop.png" alt="ショップの有無は不明です"></div>
                                    <span class="amenity-label">ショップ</span>
                                </div>
                                <div id="icon-ev" class="amenity-item inactive">
                                    <div class="icon-wrap"><img src="../icon/ev_charger.png" alt="EV充電の有無は不明です"></div>
                                    <span class="amenity-label">EV充電器</span>
                                </div>
                                <div id="icon-etc2" class="amenity-item inactive">
                                    <div class="icon-wrap"><img src="../icon/etc2.png" alt=""></div>
                                    <span class="amenity-label">ETC2.0 一時退出</span>
                                </div>
                                <a id="icon-map" class="amenity-item active google_maps" target="_blank"
                                    rel="noopener noreferrer">
                                    <div class="icon-wrap"><img src="../icon/Google_Maps.png" alt="Google Mapsで開く">
                                    </div>
                                    <span class="amenity-label">Google Maps で開く</span>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section id="nearby-stations" class="hidden">
                <h2 class="section-title">周辺の道の駅</h2>
                <div id="nearby-list" class="list-container">
                    <!-- 2〜4番目に近い道の駅をここに挿入 -->
                </div>
            </section>
        </main>

        <footer id="footer-bar-location" class="hidden">
            <div class="location-status">
                <div class="status-dot"></div>
                <p>現在地: <span id="current-address">取得中...</span></p>
            </div>
        </footer>
    </div>

    <!-- 戻るボタン（右下固定） -->
    <div class="floating-back-btn" onclick="history.back()" title="戻る">
        <img src="../icon/back.png" alt="戻る">
    </div>

    <!-- 自動検索制御フローティングボタン -->
    <div id="floating-control-bar" class="hidden">
        <button id="btn-toggle-auto" class="btn-primary floating-status-btn">
            <span class="status-indicator"></span>
            <span id="auto-status-text">現在地付近の道の駅を自動検索中…</span>
        </button>
    </div>

    <script type="module" src="recommend.js"></script>
    <!-- 位置情報取得中ポップアップ -->
    <div id="location-popup" class="hidden">
        <div class="popup-spinner"></div>
        <div class="popup-text">位置情報を取得中...</div>
    </div>
</body>

</html>
