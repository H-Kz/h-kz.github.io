<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>道の駅ナビ - 道の駅一覧</title>
    <meta name="description" content="各地の道の駅を一覧で確認できます。設備情報の有無もひと目でわかります。">
    <link rel="stylesheet" href="../styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="app">
        <header class="main-header">
            <h1>道の駅一覧</h1>
        </header>

        <main>
            <div id="station-list" class="list-container">
                <!-- JavaScriptで道の駅リストがここに挿入されます -->
                <div class="loader-inner">
                    <div class="spinner"></div>
                    <p>データを読み込み中...</p>
                </div>
            </div>
        </main>

    </div>

    <!-- 戻るボタン（右下固定） -->
    <div class="floating-back-btn" onclick="history.back()" title="戻る">
        <img src="../icon/back.png" alt="戻る">
    </div>

    <script type="module" src="list.js"></script>
</body>

</html>
