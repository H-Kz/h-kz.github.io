<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>道の駅ナビ - 道の駅一覧</title>
    <meta name="description" content="各地の道の駅を一覧で確認できます。設備情報の有無もひと目でわかります。">
    <link rel="icon" href="../icon/icon.png">
    <link rel="stylesheet" href="../styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body class="recommend-page">
    <div id="app">
        <header class="main-header">
            <h1>道の駅一覧</h1>
        </header>

        <main>
            <div class="view-tabs">
                <button id="btn-show-list" class="tab-btn active">リストで探す</button>
                <button id="btn-show-map" class="tab-btn">地図で探す</button>
            </div>

            <div id="station-list" class="list-container">
                <!-- JavaScriptで道の駅リストがここに挿入されます -->
                <div class="loader-inner">
                    <div class="spinner"></div>
                    <p>データを読み込み中...</p>
                </div>
            </div>

            <div id="list-map-container" class="hidden">
                <div id="list-map"></div>
                <div id="map-station-info" class="hidden">
                    <!-- 地図で選択された駅の情報 -->
                </div>
            </div>
        </main>

    </div>

    <!-- 統合アクションボタンは JS (UI.initGlobalActions) で生成されます -->

    <script type="module" src="list.js"></script>
</body>

</html>
