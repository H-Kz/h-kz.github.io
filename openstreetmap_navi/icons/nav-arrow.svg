<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#99c2ff"/>
    </linearGradient>
  </defs>
  <!-- Translucent blue background (rounded rectangle) -->
  <rect x="0" y="0" width="100" height="100" rx="16" fill="rgba(0, 100, 255, 0.25)"/>
  <!-- Prominent darker blue arrow -->
  <path d="M50 22 L78 78 Q50 66 22 78 Z" fill="url(#arrowGrad)" stroke-linejoin="round" filter="url(#shadow)"/>
</svg>
